<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SUBU-TETRA EMT İZLEME MERKEZİ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
 margin:0;
 font-family:Segoe UI;
 background:#0b1220;
 color:white;
 overflow:hidden;
}

/* HEADER */
.header{
 display:flex;
 align-items:center;
 gap:15px;
 padding:12px 20px;
 background:#020617;
 border-bottom:1px solid #1e293b;
}

.menuBtn{
 font-size:28px;
 cursor:pointer;
}

.header img{height:45px}
.header h1{margin:0;font-size:22px}

/* SIDEBAR */
.sidebar{
 position:fixed;
 top:0;
 left:-220px;
 width:220px;
 height:100%;
 background:#020617;
 border-right:1px solid #1e293b;
 transition:.3s;
 padding-top:80px;
}

.sidebar button{
 width:100%;
 background:none;
 border:none;
 color:white;
 padding:15px;
 text-align:left;
 font-size:16px;
 cursor:pointer;
}

.sidebar button:hover{
 background:#1e293b;
}

.sidebar.open{left:0}

/* PAGE */
.page{
 position:absolute;
 top:70px;
 left:0;
 width:100%;
 height:calc(100% - 70px);
 display:none;
 padding:15px;
 box-sizing:border-box;
}

.page.active{display:block}

/* GRID */
.grid{
 display:grid;
 grid-template-columns:2fr 1fr 1fr;
 gap:18px;
 height:100%;
}

/* CARD */
.card{
 background:#111827;
 border-radius:12px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
}

.title{opacity:.7}
.value{font-size:38px;color:#38bdf8}

/* SPEED BIG */
.speed{grid-row:span 2}

/* TIME */
.time{grid-column:span 3}

/* CSV PAGE */
.csvPage{
 display:flex;
 justify-content:center;
 align-items:center;
 height:100%;
}

.downloadBtn{
 padding:18px 40px;
 font-size:18px;
 border:none;
 border-radius:10px;
 background:#38bdf8;
 cursor:pointer;
}
</style>
</head>
<body>

<div class="header">
<div class="menuBtn" onclick="toggleMenu()">☰</div>
<img src="logo.png">
<h1>SUBU-TETRA EMT İZLEME MERKEZİ</h1>
</div>

<div class="sidebar" id="menu">
<button onclick="openPage('telemetry')">Telemetri</button>
<button onclick="openPage('graph')">Grafik</button>
<button onclick="openPage('csv')">CSV Kayıt</button>
</div>

<!-- TELEMETRY PAGE -->
<div class="page active" id="telemetry">
<div class="grid">

<div class="card speed">
<div class="title">HIZ</div>

<svg viewBox="0 0 200 120" width="90%">
<path d="M20 100 A80 80 0 0 1 180 100"
stroke="#334155" stroke-width="15" fill="none"/>
<line id="needle" x1="100" y1="100" x2="100" y2="30"
stroke="#38bdf8" stroke-width="6"
transform="rotate(-90 100 100)"/>
<circle cx="100" cy="100" r="8" fill="#38bdf8"/>
</svg>

<div class="value" id="speed">-</div>
</div>

<div class="card"><div class="title">SICAKLIK</div><div class="value" id="temp">-</div></div>
<div class="card"><div class="title">GERİLİM</div><div class="value" id="volt">-</div></div>
<div class="card"><div class="title">ENERJİ</div><div class="value" id="energy">-</div></div>
<div class="card"><div class="title">SOC</div><div class="value" id="soc">-</div></div>

<div class="card time">
<div class="title">ZAMAN</div>
<div class="value" id="time">-</div>
</div>

</div>
</div>

<!-- GRAPH PAGE -->
<div class="page" id="graph">
<canvas id="chart"></canvas>
</div>

<!-- CSV PAGE -->
<div class="page" id="csv">
<div class="csvPage">
<button class="downloadBtn" onclick="window.location='/download-csv'">
CSV DOSYASINI İNDİR
</button>
</div>
</div>

<script>

/* MENU */
function toggleMenu(){
 menu.classList.toggle("open");
}

function openPage(id){
 document.querySelectorAll(".page")
 .forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 menu.classList.remove("open");
}

/* GAUGE */
function gauge(v){
 if(v==null)return;
 const a=(v/180)*180-90;
 needle.setAttribute("transform",`rotate(${a} 100 100)`);
}

/* CHART */
const chart=new Chart(document.getElementById("chart"),{
 type:"line",
 data:{
  labels:[],
  datasets:[
   {label:"Hız",data:[]},
   {label:"Sıcaklık",data:[]}
  ]
 },
 options:{animation:false,responsive:true}
});

/* UPDATE */
async function update(){
 try{
  const r=await fetch("/last");
  const d=await r.json();
  if(!d)return;

  speed.textContent=d.speed??"-";
  temp.textContent=d.temp??"-";
  volt.textContent=d.voltage??"-";
  energy.textContent=d.energy??"-";
  soc.textContent=d.soc??"-";

  if(d.timestamp)
   time.textContent=new Date(d.timestamp).toLocaleString();

  gauge(d.speed);

  const t=new Date().toLocaleTimeString();
  chart.data.labels.push(t);
  chart.data.datasets[0].data.push(d.speed);
  chart.data.datasets[1].data.push(d.temp);

  if(chart.data.labels.length>25){
   chart.data.labels.shift();
   chart.data.datasets.forEach(x=>x.data.shift());
  }

  chart.update();

 }catch{}
}

setInterval(update,1000);
</script>
</body>
</html>
