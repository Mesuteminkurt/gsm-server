<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SUBU-TETRA EMT İZLEME MERKEZİ</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  padding:15px;
}

.header img{
  height:60px;
}

.header h1{
  margin:0;
  font-size:28px;
}

/* DASHBOARD */
.dashboard{
  flex:1;
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:20px;
  padding:20px;
  box-sizing:border-box;
}

/* CARDS */
.card{
  background:#1e293b;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:22px;
}

.value{
  font-size:38px;
  margin-top:10px;
  color:#38bdf8;
}

/* SPEED BIG */
.speed{
  grid-row:span 2;
}

/* TIME */
.time{
  grid-column:span 2;
}

/* BUTTON */
.download{
  padding:10px;
  text-align:center;
}

button{
  background:#38bdf8;
  border:none;
  padding:12px 30px;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
}
button:hover{
  background:#0ea5e9;
}
</style>
</head>
<body>

<div class="header">
<img src="logo.png">
<h1>SUBU-TETRA EMT İZLEME MERKEZİ</h1>
</div>

<div class="dashboard">

<!-- SPEED -->
<div class="card speed">
Araç Hızı

<svg viewBox="0 0 200 120" width="90%">
<path d="M20 100 A80 80 0 0 1 180 100"
stroke="#334155"
stroke-width="15"
fill="none"/>

<line id="needle"
x1="100" y1="100"
x2="100" y2="30"
stroke="#38bdf8"
stroke-width="6"
stroke-linecap="round"
transform="rotate(-90 100 100)"/>

<circle cx="100" cy="100" r="8" fill="#38bdf8"/>
</svg>

<div class="value" id="speed">-</div>
</div>

<!-- TEMP -->
<div class="card">
Batarya Sıcaklığı
<div class="value" id="temp">-</div>
</div>

<!-- VOLTAGE -->
<div class="card">
Gerilim
<div class="value" id="voltage">-</div>
</div>

<!-- ENERGY -->
<div class="card">
Enerji
<div class="value" id="energy">-</div>
</div>

<!-- SOC -->
<div class="card">
Batarya SoC
<div class="value" id="soc">-</div>
</div>

<!-- TIME -->
<div class="card time">
Zaman
<div class="value" id="time">-</div>
</div>

</div>

<div class="download">
<button onclick="downloadCSV()">CSV indir</button>
</div>

<script>
function safe(v){
  return (v===undefined || v===null) ? "-" : v;
}

function updateGauge(speed){
  if(speed==="-" ) return;

  const angle=(speed/180)*180-90;
  document.getElementById("needle")
  .setAttribute("transform",`rotate(${angle} 100 100)`);
}

async function update(){
  try{
    const res=await fetch("/last");
    const d=await res.json();
    if(!d)return;

    document.getElementById("speed").innerText=safe(d.speed);
    document.getElementById("temp").innerText=safe(d.temp);
    document.getElementById("voltage").innerText=safe(d.voltage);
    document.getElementById("energy").innerText=safe(d.energy);
    document.getElementById("soc").innerText=safe(d.soc);

    if(d.timestamp)
      document.getElementById("time").innerText =
        new Date(d.timestamp).toLocaleString();

    updateGauge(d.speed);

  }catch{}
}

setInterval(update,1000);

function downloadCSV(){
  window.location="/download-csv";
}
</script>

</body>
</html>
