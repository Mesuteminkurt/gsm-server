<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SUBU-TETRA Telemetri</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0f172a;
  color:white;
  overflow:hidden;
}

/* MENU */
.menu-btn{
  position:fixed;
  top:15px;
  left:15px;
  font-size:30px;
  cursor:pointer;
  z-index:9999;
}

.sidebar{
  position:fixed;
  top:0;
  left:-250px;
  width:250px;
  height:100%;
  background:#020617;
  padding-top:80px;
  transition:.3s;
  z-index:9998;
}

.sidebar a{
  display:block;
  padding:15px;
  color:white;
  text-decoration:none;
  font-size:18px;
}
.sidebar a:hover{
  background:#1e293b;
}

/* PAGES */
.page{
  display:none;
  height:100vh;
  width:100vw;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.active{
  display:flex;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  width:90%;
  max-width:900px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.value{
  font-size:32px;
  margin-top:10px;
  color:#38bdf8;
}

.time{
  grid-column:span 2;
}

/* GAUGE */
#gauge{
  background:#020617;
  border-radius:50%;
}

/* TEMP ALERT */
.alert{
  color:red;
  font-weight:bold;
}

/* BUTTON */
button{
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#38bdf8;
  cursor:pointer;
}
button:hover{
  background:#0ea5e9;
}
</style>
</head>
<body>

<div class="menu-btn" onclick="toggleMenu()">☰</div>

<div class="sidebar" id="menu">
<a onclick="showPage('telemetry')">Telemetri</a>
<a onclick="showPage('graph')">Grafik</a>
<a onclick="showPage('csv')">CSV Kayıt</a>
</div>

<!-- TELEMETRI -->
<div id="telemetry" class="page active">

<canvas id="gauge" width="250" height="250"></canvas>

<div class="grid">

<div class="card">
Batarya Sıcaklığı
<div id="temp" class="value">-</div>
</div>

<div class="card">
Gerilim
<div id="voltage" class="value">-</div>
</div>

<div class="card">
Enerji
<div id="energy" class="value">-</div>
</div>

<div class="card time">
Zaman
<div id="time" class="value">-</div>
</div>

</div>
</div>

<!-- GRAPH -->
<div id="graph" class="page">
<canvas id="chart" width="800" height="400"></canvas>
</div>

<!-- CSV -->
<div id="csv" class="page">
<h2>CSV Kayıt İndir</h2>
<button onclick="downloadCSV()">CSV İndir</button>
</div>

<script>

/* MENU */
function toggleMenu(){
  let m=document.getElementById("menu");
  m.style.left = m.style.left==="0px" ? "-250px" : "0px";
}

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.getElementById("menu").style.left="-250px";
}

/* GAUGE */
const gctx=document.getElementById("gauge").getContext("2d");

function drawGauge(speed){
  let s = Number(speed)||0;
  gctx.clearRect(0,0,250,250);

  gctx.beginPath();
  gctx.arc(125,125,100,Math.PI,0);
  gctx.strokeStyle="#334155";
  gctx.lineWidth=20;
  gctx.stroke();

  let angle=Math.PI+(s/100)*Math.PI;

  gctx.beginPath();
  gctx.arc(125,125,100,Math.PI,angle);
  gctx.strokeStyle="#38bdf8";
  gctx.lineWidth=20;
  gctx.stroke();

  gctx.fillStyle="white";
  gctx.font="30px Segoe UI";
  gctx.textAlign="center";
  gctx.fillText(s+" km/h",125,140);
}

/* GRAPH */
const ctx=document.getElementById("chart").getContext("2d");

const chart=new Chart(ctx,{
type:"line",
data:{
labels:[],
datasets:[{
label:"Hız",
data:[],
borderColor:"#38bdf8",
tension:.3
}]
},
options:{responsive:true}
});

/* CSV DOWNLOAD */
function downloadCSV(){
  window.location="/download";
}

/* DATA FETCH */
async function update(){
  try{
    let r=await fetch("/last");
    let d=await r.json();
    if(!d) return;

    let speed=d.speed??0;
    let temp=d.temp??0;
    let voltage=d.voltage??0;
    let energy=d.energy??0;

    drawGauge(speed);

    document.getElementById("temp").innerHTML =
      temp>60 ? `<span class="alert">${temp} °C ⚠</span>` : temp+" °C";

    document.getElementById("voltage").innerText=voltage+" V";
    document.getElementById("energy").innerText=energy+" Wh";
    document.getElementById("time").innerText=
      new Date(d.timestamp).toLocaleString();

    chart.data.labels.push("");
    chart.data.datasets[0].data.push(speed);

    if(chart.data.labels.length>20){
      chart.data.labels.shift();
      chart.data.datasets[0].data.shift();
    }

    chart.update();

  }catch{}
}

setInterval(update,1000);
</script>
</body>
</html>
