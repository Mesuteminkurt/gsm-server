<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SUBU-TETRA EMT</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,Segoe UI;
background:linear-gradient(140deg,#020617,#0f172a,#020617);
color:white;
overflow:hidden;
}

/* HEADER */
.header{
height:70px;
display:flex;
align-items:center;
gap:18px;
padding:0 25px;
background:rgba(2,6,23,.75);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,.05);
}
.logo{height:46px}
.title{font-size:21px;font-weight:600}

/* MENU */
.menu-btn{
position:fixed;
top:18px;
right:22px;
font-size:28px;
cursor:pointer;
z-index:10001;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
opacity:0;
pointer-events:none;
transition:.25s;
z-index:9998;
}
.overlay.show{opacity:1;pointer-events:auto}

.sidebar{
position:fixed;
top:0;
right:-270px;
width:270px;
height:100%;
background:#020617;
padding-top:90px;
transition:.35s;
z-index:10000;
border-left:1px solid rgba(255,255,255,.05);
}
.sidebar.show{right:0}

.sidebar a{
display:block;
padding:20px 28px;
color:#cbd5f5;
text-decoration:none;
font-size:17px;
transition:.25s;
}
.sidebar a:hover{
background:#0f172a;
color:white;
padding-left:35px;
}

/* PAGES */
.page{
display:none;
height:calc(100vh - 70px);
align-items:center;
justify-content:center;
flex-direction:column;
padding:20px;
}
.active{display:flex}

/* CARDS */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
width:95%;
max-width:980px;
}
.card{
background:rgba(30,41,59,.6);
backdrop-filter:blur(15px);
border-radius:18px;
padding:25px;
text-align:center;
border:1px solid rgba(255,255,255,.05);
box-shadow:0 0 25px rgba(0,0,0,.4);
transition:.25s;
}
.card:hover{
transform:translateY(-4px);
box-shadow:0 0 35px rgba(56,189,248,.18);
}
.value{
font-size:34px;
margin-top:10px;
color:#38bdf8;
font-weight:600;
}
.time{grid-column:span 2}
.alert{color:#ef4444;font-weight:700}

/* BUTTON */
button{
padding:14px 50px;
font-size:16px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#38bdf8,#0ea5e9);
color:white;
cursor:pointer;
box-shadow:0 0 25px rgba(56,189,248,.35);
transition:.25s;
}
button:hover{transform:scale(1.05)}

/* TABLE */
.tableBox{
max-height:420px;
overflow:auto;
background:#020617;
padding:18px;
border-radius:15px;
margin-top:20px;
width:95%;
max-width:950px;
border:1px solid rgba(255,255,255,.05);
}

table{width:100%;border-collapse:collapse;font-size:14px}
thead{position:sticky;top:0;background:#020617;}

th,td{
padding:11px;
border-bottom:1px solid #1e293b;
text-align:center;
}

th{color:#38bdf8;font-weight:600}
tbody tr:hover{background:#0f172a}

/* GAUGE */
#gauge{
margin-bottom:20px;
filter:drop-shadow(0 0 25px rgba(56,189,248,.4));
}
</style>
</head>
<body>

<div class="header">
<img src="logo.png" class="logo">
<div class="title">SUBU-TETRA EMT TELEMETRİ MERKEZİ</div>
</div>

<div class="menu-btn" onclick="toggleMenu()">☰</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="sidebar" id="menu">
<a onclick="showPage('telemetry')">Telemetri Paneli</a>
<a onclick="showPage('graph')">Canlı Grafik</a>
<a onclick="showPage('csv')">CSV Kayıtları</a>
</div>

<!-- TELEMETRİ -->
<div id="telemetry" class="page active">
<canvas id="gauge" width="260" height="260"></canvas>

<div class="grid">
<div class="card">Sıcaklık<div id="temp" class="value">-</div></div>
<div class="card">Voltaj<div id="voltage" class="value">-</div></div>
<div class="card">Enerji<div id="energy" class="value">-</div></div>
<div class="card">SOC<div id="soc" class="value">-</div></div>
<div class="card time">Zaman<div id="time" class="value">-</div></div>
</div>
</div>

<!-- GRAPH -->
<div id="graph" class="page">
<canvas id="chart" width="950" height="450"></canvas>
</div>

<!-- CSV -->
<div id="csv" class="page">
<button onclick="downloadCSV()">CSV İndir</button>

<div class="tableBox">
<table id="csvTable">
<thead>
<tr>
<th>Zaman</th>
<th>Hız</th>
<th>Sıcaklık</th>
<th>Voltaj</th>
<th>Enerji</th>
<th>SOC</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>

<script>
const menu=document.getElementById("menu");
const overlay=document.getElementById("overlay");

function toggleMenu(){
menu.classList.toggle("show");
overlay.classList.toggle("show");
}

function showPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
toggleMenu();
}

/* GAUGE */
const g=document.getElementById("gauge").getContext("2d");
function drawGauge(speed){
let s=Number(speed)||0;
g.clearRect(0,0,260,260);

g.beginPath();
g.arc(130,130,110,Math.PI,0);
g.strokeStyle="#1e293b";
g.lineWidth=20;
g.stroke();

let a=Math.PI+(s/120)*Math.PI;
g.beginPath();
g.arc(130,130,110,Math.PI,a);
g.strokeStyle="#38bdf8";
g.lineWidth=20;
g.stroke();

g.fillStyle="white";
g.font="32px Segoe UI";
g.textAlign="center";
g.fillText(s+" km/h",130,145);
}

/* CHART */
const ctx=document.getElementById("chart").getContext("2d");
const chart=new Chart(ctx,{
type:"line",
data:{labels:[],datasets:[
{label:"Hız",data:[],borderColor:"#38bdf8"},
{label:"Sıcaklık",data:[],borderColor:"#ef4444"},
{label:"Voltaj",data:[],borderColor:"#22c55e"},
{label:"Enerji",data:[],borderColor:"#facc15"},
{label:"SOC",data:[],borderColor:"#a855f7"}
]},
options:{responsive:true,animation:false}
});

/* CSV DOWNLOAD */
function downloadCSV(){
window.location="/download-csv";
}

/* ---- PERFORMANCE FIX: Track last data to avoid redundant updates ---- */
let logVersion = -1;

/* CSV TABLE LOAD — DocumentFragment ile hızlı DOM oluşturma */
async function loadCSV(){
try{
let r=await fetch("/logs?v=" + logVersion);

// 204 = veri değişmemiş, DOM'a dokunma
if(r.status === 204) return;

let json=await r.json();
logVersion = json.version;
let data = json.data;

let tbody=document.querySelector("#csvTable tbody");

// DocumentFragment ile tek seferde DOM'a ekle (innerHTML+= yerine)
let frag = document.createDocumentFragment();
for(let i = 0; i < data.length; i++){
  let d = data[i];
  let tr = document.createElement("tr");

  let td1 = document.createElement("td");
  td1.textContent = new Date(d.timestamp).toLocaleString();
  tr.appendChild(td1);

  let td2 = document.createElement("td");
  td2.textContent = d.speed;
  tr.appendChild(td2);

  let td3 = document.createElement("td");
  td3.textContent = d.temp;
  tr.appendChild(td3);

  let td4 = document.createElement("td");
  td4.textContent = d.voltage;
  tr.appendChild(td4);

  let td5 = document.createElement("td");
  td5.textContent = d.energy;
  tr.appendChild(td5);

  let td6 = document.createElement("td");
  td6.textContent = d.soc;
  tr.appendChild(td6);

  frag.appendChild(tr);
}
tbody.innerHTML = "";
tbody.appendChild(frag);

}catch{}
}

/* DATA UPDATE — Sadece değişen veriyi güncelle */
let prevTimestamp = null;

async function update(){
try{
let r=await fetch("/last");
let d=await r.json();
if(!d.timestamp) return;

// Aynı veri geliyorsa DOM güncellemesini atla
if(d.timestamp === prevTimestamp) return;
prevTimestamp = d.timestamp;

drawGauge(d.speed);

document.getElementById("temp").innerHTML=
d.temp>60?`<span class="alert">${d.temp} °C ⚠</span>`:d.temp+" °C";

document.getElementById("voltage").innerText=d.voltage+" V";
document.getElementById("energy").innerText=d.energy+" Wh";
document.getElementById("soc").innerText=d.soc+" %";
document.getElementById("time").innerText=new Date(d.timestamp).toLocaleString();

chart.data.labels.push("");
chart.data.datasets[0].data.push(d.speed);
chart.data.datasets[1].data.push(d.temp);
chart.data.datasets[2].data.push(d.voltage);
chart.data.datasets[3].data.push(d.energy);
chart.data.datasets[4].data.push(d.soc);

if(chart.data.labels.length>50){
  chart.data.labels.shift();
  chart.data.datasets.forEach(ds=>ds.data.shift());
}
chart.update();

}catch{}
}

setInterval(update,1000);
setInterval(loadCSV,5000);
</script>
</body>
</html>
