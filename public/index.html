<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SUBU-TETRA EMT İZLEME MERKEZİ</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
  margin:0;
}

/* HEADER */
.header{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  padding:20px;
}

.header img{
  height:75px;
}

.header h1{
  margin:0;
  font-size:32px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
  margin:40px;
}

/* CARD */
.card{
  background:#1e293b;
  padding:35px;
  border-radius:14px;
  font-size:24px;
  box-shadow:0 0 15px rgba(0,0,0,0.4);
  transition:.3s;
}

.card:hover{
  transform:scale(1.03);
}

.value{
  font-size:42px;
  margin-top:10px;
  color:#38bdf8;
}

.time{
  grid-column:span 2;
  background:#020617;
}

/* BUTTON */
.download{
  margin-bottom:30px;
}

button{
  background:#38bdf8;
  border:none;
  padding:15px 30px;
  font-size:18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#0ea5e9;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
<img src="logo.png">
<h1>SUBU-TETRA EMT İZLEME MERKEZİ</h1>
</div>

<!-- GRID -->
<div class="grid">

<!-- SPEED GAUGE -->
<div class="card">
Araç Hızı (km/h)

<svg viewBox="0 0 200 120" width="100%">
  <path d="M20 100 A80 80 0 0 1 180 100"
        stroke="#334155"
        stroke-width="15"
        fill="none"/>

  <line id="needle"
        x1="100" y1="100"
        x2="100" y2="30"
        stroke="#38bdf8"
        stroke-width="6"
        stroke-linecap="round"
        transform="rotate(-90 100 100)"/>

  <circle cx="100" cy="100" r="8" fill="#38bdf8"/>
</svg>

<div class="value" id="speedText">0</div>
</div>

<!-- TEMP -->
<div class="card">
Batarya Sıcaklığı (°C)
<div class="value" id="temp">-</div>
</div>

<!-- VOLTAGE -->
<div class="card">
Batarya Gerilimi (V)
<div class="value" id="voltage">-</div>
</div>

<!-- ENERGY -->
<div class="card">
Kalan Enerji (Wh)
<div class="value" id="energy">-</div>
</div>

<!-- SOC -->
<div class="card">
Batarya SoC (%)
<div class="value" id="soc">-</div>
</div>

<!-- TIME -->
<div class="card time">
Zaman / Tarih
<div class="value" id="time">-</div>
</div>

</div>

<!-- DOWNLOAD -->
<div class="download">
<button onclick="downloadCSV()">CSV İndir</button>
</div>

<script>
function updateSpeedGauge(speed){
  const min=0;
  const max=180;
  const angle=((speed-min)/(max-min))*180-90;

  document
  .getElementById("needle")
  .setAttribute("transform",`rotate(${angle} 100 100)`);

  document.getElementById("speedText").innerText=speed;
}

async function updateData(){
  try{
    const res=await fetch("/last");
    const data=await res.json();
    if(!data)return;

    updateSpeedGauge(data.speed);

    document.getElementById("temp").innerText=data.temp;
    document.getElementById("voltage").innerText=data.voltage;
    document.getElementById("energy").innerText=data.energy;
    document.getElementById("soc").innerText=data.soc ?? "-";

    document.getElementById("time").innerText=
      new Date(data.timestamp).toLocaleString();

  }catch{
    console.log("Veri bekleniyor...");
  }
}

setInterval(updateData,1000);

function downloadCSV(){
  window.location.href="/download-csv";
}
</script>

</body>
</html>
